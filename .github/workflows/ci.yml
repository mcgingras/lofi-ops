name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker image builds and serves /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t lofi-ops:ci .
      - run: docker run -d --name lofi -p 8080:8080 lofi-ops:ci
      - name: smoke test (healthz, page, socket joins a match)
        run: |
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          npx tsx scripts/smoke.ts http://127.0.0.1:8080
      - name: graceful stop
        run: |
          docker stop -t 10 lofi
          docker logs lofi
          test "$(docker inspect lofi --format '{{.State.ExitCode}}')" = "0"

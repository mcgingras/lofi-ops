<title>Yard Look Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* One full-bleed low-res render with the HUD drawn inside it; the only web chrome is a small control column, top left. */
:root{
  --void:#08090d;
  --chip:rgba(10,10,14,.72);
  --line:rgba(236,226,206,.18);
  --paper:#ece2ce;
  --dim:#9e97a8;
  --hi:#ffd84a;
  --ui:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--paper);overflow:hidden;font-family:var(--ui)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair;touch-action:none}
.panel{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:calc(100vw - 24px)}
.panel button{all:unset;cursor:pointer;font-family:var(--ui);font-size:10px;letter-spacing:.04em;text-transform:uppercase;background:var(--chip);border:1px solid var(--line);padding:3px 7px;display:flex;gap:6px;align-items:center;color:var(--dim)}
.panel button b{font-weight:400;color:var(--hi)}
.panel button:hover{color:var(--paper);border-color:var(--paper)}
.panel button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.panel kbd{font-family:var(--ui);font-size:9px;border:1px solid var(--line);padding:0 3px;color:var(--paper)}
.hint{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper);opacity:.7;margin-top:4px;max-width:260px;line-height:1.5;text-shadow:0 1px 0 #000}
#hide{margin-top:2px}
.panel.min button:not(#hide),.panel.min .hint{display:none}
@media (max-width:560px){.hint{display:none}}
#dev{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:400 12px/1.4 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--paper);background:var(--chip);border:1px solid var(--line);padding:8px 12px;pointer-events:none}
#dropHint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:400 14px/1 var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--hi);background:rgba(8,9,13,.55);border:2px dashed var(--hi);pointer-events:none}
</style>

<canvas id="view" aria-label="Low-poly first-person container yard"></canvas>
<div id="dev">Developing photos…</div>
<div id="dropHint" hidden>Drop to put this photo on the surface under the crosshair</div>
<div class="panel" id="panel">
  <button id="tLook" type="button"><kbd>P</kbd>Look <b>Photo</b></button>
  <button id="tTime" type="button"><kbd>T</kbd>Time <b>Night</b></button>
  <button id="tBake" type="button"><kbd>L</kbd>Light <b>Baked</b></button>
  <button id="tDither" type="button"><kbd>N</kbd>Dither <b>PS1</b></button>
  <button id="tWobble" type="button"><kbd>V</kbd>Wobble <b>Pixel</b></button>
  <button id="tWarp" type="button"><kbd>B</kbd>Texture warp <b>On</b></button>
  <button id="tRes" type="button"><kbd>C</kbd>Res <b>240p</b></button>
  <button id="tHud" type="button"><kbd>H</kbd>HUD <b>On</b></button>
  <button id="tGrade" type="button"><kbd>G</kbd>Grade <b>Natural</b></button>
  <button id="tSwap" type="button"><kbd>F</kbd>Photo onto target</button>
  <button id="hide" type="button">Hide controls</button>
  <div class="hint">Click to lock aim · WASD walk · Shift run · hold click to fire · right-click aim · R reload · textures from Poly Haven (CC0) · Esc, then drop a photo on the view to retexture whatever is under the crosshair</div>
  <input type="file" id="swapFile" accept="image/*" hidden>
</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js';
THREE.ColorManagement.enabled = false;

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(1);
renderer.autoClear = false;

let seed = 23;
const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();
const clamp = THREE.MathUtils.clamp, smooth = THREE.MathUtils.smoothstep;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z).normalize();

/* ---------- textures: small, busy, colour baked in, posterised to 16 levels per channel ---------- */
function makeTex(w, h, draw, wrap = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) for (let k = 0; k < 3; k++) d[i + k] = Math.round(d[i + k] / 17) * 17;
  g.putImageData(im, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = wrap ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  t.colorSpace = THREE.NoColorSpace;

}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const col = (c, k = 1, a = 1) => `rgba(${clamp(c[0] * k, 0, 255) | 0},${clamp(c[1] * k, 0, 255) | 0},${clamp(c[2] * k, 0, 255) | 0},${a})`;
function grain(g, x0, y0, w, h, c, amt = .1) { const b = hex(c); for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) { g.fillStyle = col(b, 1 + (rnd() - .5) * 2 * amt); g.fillRect(x, y, 1, 1); } }

function containerTex(base, label) {

    const b = hex(base);
    for (let x = 0; x < 128; x++) { const rib = Math.sin(x / 128 * Math.PI * 40), k = .74 + .2 * rib + (rib > .92 ? .14 : 0); for (let y = 0; y < 64; y++) { g.fillStyle = col(b, k * rr(.93, 1.06)); g.fillRect(x, y, 1, 1); } }
    g.fillStyle = col(b, .5); g.fillRect(0, 0, 128, 3); g.fillRect(0, 59, 128, 5); g.fillRect(0, 0, 3, 64); g.fillRect(125, 0, 3, 64);
    g.fillStyle = col(b, 1.3); g.fillRect(0, 3, 128, 1);
    streaks(g, 128, 3, 34, 34, .55);
    blotch(g, 128, 64, 8, '#000000', .2, 3, 9);
    for (let y = 42; y < 59; y++) { g.fillStyle = `rgba(28,20,14,${(y - 42) / 17 * .55})`; g.fillRect(0, y, 128, 1); }
    stencil(g, label, 8, 14, 8, 'rgba(240,236,226,.92)'); stencil(g, '22G1   MGW 30480', 8, 22, 6, 'rgba(240,236,226,.8)');

}

  shed: makeTex(64, 64, g => { for (let x = 0; x < 64; x++) for (let y = 0; y < 64; y++) { g.fillStyle = col(hex('#6f7f8c'), (.72 + .28 * Math.sin(x / 64 * Math.PI * 16)) * rr(.94, 1.05)); g.fillRect(x, y, 1, 1); } streaks(g, 64, 0, 16, 40, .4); for (let y = 50; y < 64; y++) { g.fillStyle = `rgba(30,26,22,${(y - 50) / 14 * .5})`; g.fillRect(0, y, 64, 1); } }),
  shutter: makeTex(64, 64, g => { for (let y = 0; y < 64; y++) { const k = .78 + .22 * Math.sin(y / 64 * Math.PI * 32); grain(g, 0, y, 64, 1, '#959ba1', .04); g.fillStyle = `rgba(0,0,0,${(1 - k) * .9})`; g.fillRect(0, y, 64, 1); } streaks(g, 64, 0, 10, 50, .35); g.fillStyle = '#2a2a2a'; g.fillRect(0, 0, 3, 64); g.fillRect(61, 0, 3, 64); g.fillRect(28, 56, 8, 3); }, false),
  hazard: makeTex(32, 32, g => { for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) { g.fillStyle = col(hex(((x + y) >> 3) & 1 ? '#e9b82c' : '#1d1a17'), rr(.85, 1.1)); g.fillRect(x, y, 1, 1); } blotch(g, 32, 32, 8, '#3a3630', .6, 2, 5); }),
  paint: makeTex(16, 16, (g, w, h) => { grain(g, 0, 0, w, h, '#d9a72a', .1); g.clearRect(rr(0, 16) | 0, rr(0, 16) | 0, 2, 1); g.clearRect(rr(0, 16) | 0, rr(0, 16) | 0, 1, 2); g.clearRect(rr(0, 16) | 0, rr(0, 16) | 0, 2, 2); }),
  crate: makeTex(32, 32, g => { grain(g, 0, 0, 32, 32, '#a67c4e', .09); g.fillStyle = '#6a4628'; g.fillRect(0, 0, 32, 3); g.fillRect(0, 29, 32, 3); g.fillRect(0, 0, 3, 32); g.fillRect(29, 0, 3, 32); for (let i = 3; i < 27; i++) g.fillRect(i, i, 3, 3); g.fillStyle = 'rgba(30,20,10,.5)'; g.fillRect(8, 12, 12, 1); stencil(g, 'FRAGILE', 5, 22, 6, 'rgba(40,24,12,.7)'); }),
  pallet: makeTex(32, 16, g => { g.fillStyle = '#2a2018'; g.fillRect(0, 0, 32, 16); for (let x = 0; x < 32; x += 8) grain(g, x, 0, 6, 16, '#b08a5a', .1); grain(g, 0, 6, 32, 4, '#9a7448', .1); }),
  barrel: makeTex(32, 32, g => { grain(g, 0, 0, 32, 32, '#d4d4d4', .06); g.fillStyle = '#3a3a3a'; g.fillRect(0, 5, 32, 2); g.fillRect(0, 25, 32, 2); blotch(g, 32, 32, 8, '#6a3a1a', .55, 2, 6); g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(10, 12, 12, 8); g.fillStyle = '#b02020'; g.fillRect(14, 13, 4, 6); }),
  barrier: makeTex(32, 16, g => { grain(g, 0, 0, 32, 16, '#a9a49b', .08); for (let x = 0; x < 32; x++) { g.fillStyle = (x >> 2) % 2 ? '#c8352a' : '#eeeae0'; g.fillRect(x, 2, 1, 3); } blotch(g, 32, 16, 6, '#4a443c', .4, 1, 4); }),
  tank: makeTex(64, 32, g => { grain(g, 0, 0, 64, 32, '#d8d4c8', .05); g.fillStyle = '#2f5a8a'; g.fillRect(0, 13, 64, 5); streaks(g, 64, 0, 16, 20, .45); stencil(g, 'DIESEL', 18, 11, 8, '#2a2a2a'); stencil(g, 'NO SMOKING', 14, 28, 6, '#a02020'); }),
  yellow: makeTex(16, 16, (g, w, h) => { grain(g, 0, 0, w, h, '#e0a82a', .08); blotch(g, w, h, 4, '#3a2a10', .5, 1, 4); }),
  steel: makeTex(32, 32, (g, w, h) => { grain(g, 0, 0, w, h, '#5a5e64', .12); g.fillStyle = '#7a7f88'; for (let i = 0; i < 4; i++) g.fillRect(0, rr(0, 32) | 0, 32, 1); blotch(g, w, h, 6, '#6a3a1a', .4, 2, 5); }),
  rubber: makeTex(8, 8, (g, w, h) => grain(g, 0, 0, w, h, '#26241f', .15)),
  fence: makeTex(32, 32, g => { g.fillStyle = '#b8b2a6'; for (let i = 0; i < 32; i++) { g.fillRect(i, i, 1, 1); g.fillRect((i + 16) % 32, i, 1, 1); g.fillRect(31 - i, i, 1, 1); g.fillRect((47 - i) % 32, i, 1, 1); } }),
  hut: makeTex(32, 32, g => { for (let x = 0; x < 32; x++) for (let y = 0; y < 32; y++) { g.fillStyle = col(hex('#d8d2c2'), (.82 + .18 * Math.sin(x / 32 * Math.PI * 8)) * rr(.95, 1.05)); g.fillRect(x, y, 1, 1); } streaks(g, 32, 0, 6, 20, .35); }),
  hutWin: makeTex(16, 16, g => { g.fillStyle = '#20262c'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#cfe6ff'; g.fillRect(1, 1, 14, 9); g.fillStyle = '#8fb0d0'; g.fillRect(1, 7, 14, 3); g.fillStyle = '#20262c'; g.fillRect(7, 1, 2, 9); g.fillStyle = '#4a3a2a'; g.fillRect(3, 6, 4, 2); }, false),
  winRow: makeTex(16, 8, g => { g.fillStyle = '#2a2420'; g.fillRect(0, 0, 16, 8); g.fillStyle = '#ffb45a'; g.fillRect(1, 1, 6, 6); g.fillRect(9, 1, 6, 6); g.fillStyle = '#c47a30'; g.fillRect(1, 5, 6, 2); }, false),
  door: makeTex(16, 32, g => { grain(g, 0, 0, 16, 32, '#3d5a47', .06); g.fillStyle = '#26362c'; g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 32); g.fillRect(15, 0, 1, 32); g.fillStyle = '#c8c0a8'; g.fillRect(12, 16, 2, 2); }, false),
  exit: makeTex(32, 16, g => { g.fillStyle = '#0f5a2a'; g.fillRect(0, 0, 32, 16); g.fillStyle = '#d8ffd8'; g.font = 'bold 9px "Courier New",monospace'; g.textAlign = 'center'; g.fillText('EXIT', 16, 12); }, false),
  lamp: makeTex(8, 8, (g, w, h) => grain(g, 0, 0, w, h, '#ffe2a8', .03)),
  numbers: ['01', '02', '03'].map(n => makeTex(32, 32, g => { g.font = 'bold 26px "Courier New",monospace'; g.textAlign = 'center'; g.fillStyle = '#e8e2d0'; g.fillText(n, 16, 26); for (let i = 0; i < 40; i++) g.clearRect(rr(0, 32) | 0, rr(0, 32) | 0, 1, 1); }, false)),
  glow: makeTex(32, 32, g => { const rg = g.createRadialGradient(16, 16, 0, 16, 16, 16); rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(.3, 'rgba(255,255,255,.5)'); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(0, 0, 32, 32); }, false),
  flash: makeTex(16, 16, g => { g.fillStyle = '#ffcf40'; for (let i = 1; i < 15; i++) { g.fillRect(i, 7, 1, 2); g.fillRect(7, i, 2, 1); } for (let i = 3; i < 13; i++) { g.fillRect(i, i, 1, 1); g.fillRect(15 - i, i, 1, 1); } g.fillStyle = '#fff6d0'; g.fillRect(5, 5, 6, 6); g.fillRect(6, 3, 4, 10); g.fillRect(3, 6, 10, 4); }, false),
  face: makeTex(16, 16, g => { grain(g, 0, 0, 16, 16, '#c99a78', .05); grain(g, 0, 0, 16, 5, '#3c4a2c', .1); g.fillStyle = '#1a1414'; g.fillRect(4, 8, 2, 2); g.fillRect(10, 8, 2, 2); g.fillStyle = '#8a4a40'; g.fillRect(6, 12, 4, 1); }),
  camo: makeTex(32, 32, (g, w, h) => { grain(g, 0, 0, w, h, '#5a6b3a', .06); blotch(g, w, h, 12, '#3d4a28', 1, 4, 9); blotch(g, w, h, 8, '#7a6a45', 1, 3, 7); blotch(g, w, h, 6, '#2e2b22', 1, 2, 5); }),
  vest: makeTex(16, 16, (g, w, h) => { grain(g, 0, 0, w, h, '#3a3f30', .1); g.fillStyle = '#26291f'; g.fillRect(2, 4, 5, 4); g.fillRect(9, 4, 5, 4); g.fillRect(0, 12, 16, 2); }),
  gunmetal: makeTex(32, 32, (g, w, h) => { grain(g, 0, 0, w, h, '#34363b', .12); g.fillStyle = '#6a6f78'; g.fillRect(0, 0, 32, 1); g.fillRect(0, 16, 32, 1); g.fillStyle = '#141518'; for (let x = 4; x < 32; x += 6) g.fillRect(x, 6, 3, 1); g.fillRect(8, 22, 2, 2); g.fillRect(22, 24, 2, 2); }),
  gunwood: makeTex(32, 32, (g, w, h) => { grain(g, 0, 0, w, h, '#6b4127', .08); g.fillStyle = 'rgba(30,15,6,.5)'; for (let i = 0; i < 10; i++) g.fillRect(0, rr(0, 32) | 0, rr(8, 32) | 0, 1); }),
  glove: makeTex(8, 8, (g, w, h) => grain(g, 0, 0, w, h, '#3a3226', .14)),
  skyNight: makeTex(1024, 512, g => {

    const lg = g.createLinearGradient(0, 0, 0, 128); [[0, '#04050c'], [.42, '#0e1226'], [.5, '#1c2240'], [.53, '#141a30'], [1, '#0a0c16']].forEach(([o, c]) => lg.addColorStop(o, c)); g.fillStyle = lg; g.fillRect(0, 0, 256, 128);

    g.fillStyle = 'rgba(180,200,255,.18)'; g.beginPath(); g.arc(70, 30, 12, 0, 7); g.fill(); g.fillStyle = '#e8ecf8'; g.beginPath(); g.arc(70, 30, 5, 0, 7); g.fill();
    for (let i = 0; i < 12; i++) { g.fillStyle = 'rgba(30,36,64,.7)'; const x = rr(0, 256), y = rr(30, 60); g.fillRect(x, y, rr(20, 60), 2); g.fillRect(x - 256, y, 40, 2); }
  }),
  skyGrey: makeTex(256, 128, g => {
    const lg = g.createLinearGradient(0, 0, 0, 128); [[0, '#5d636c'], [.45, '#959aa1'], [.5, '#aeb2b6'], [.53, '#a2a6aa'], [1, '#8a8e93']].forEach(([o, c]) => lg.addColorStop(o, c)); g.fillStyle = lg; g.fillRect(0, 0, 256, 128);
    for (let i = 0; i < 40; i++) { const x = rr(0, 256), y = rr(8, 60), w = rr(20, 70), h = rr(3, 8); for (const ox of [0, -256]) { g.fillStyle = `rgba(${rnd() > .5 ? '200,204,210' : '80,86,94'},${rr(.15, .35)})`; g.fillRect(x + ox, y, w, h); } }
  }),
  skyDusk: makeTex(256, 128, g => {
    const lg = g.createLinearGradient(0, 0, 0, 128); [[0, '#1b1540'], [.28, '#4a2a63'], [.42, '#b2506a'], [.5, '#ff9a52'], [.53, '#e07a4c'], [1, '#5b3346']].forEach(([o, c]) => lg.addColorStop(o, c)); g.fillStyle = lg; g.fillRect(0, 0, 256, 128);
    g.fillStyle = 'rgba(255,210,140,.35)'; g.beginPath(); g.arc(190, 58, 18, 0, 7); g.fill(); g.fillStyle = '#ffd690'; g.beginPath(); g.arc(190, 58, 9, 0, 7); g.fill();
    for (let i = 0; i < 22; i++) { g.fillStyle = `rgba(110,48,88,${rr(.5, .85)})`; const x = rr(0, 256), y = rr(34, 60); g.fillRect(x, y, rr(20, 80), rr(1, 3) | 0); g.fillRect(x - 256, y, 60, 2); }
  }),
};
TX.knit = makeTex(16, 16, (g, w, h) => grain(g, 0, 0, w, h, '#2c2c2a', .12));
TX.mask = makeTex(16, 16, g => { grain(g, 0, 0, 16, 16, '#2c2c2a', .12); grain(g, 2, 6, 12, 3, '#c99a78', .05); g.fillStyle = '#141010'; g.fillRect(4, 7, 2, 1); g.fillRect(10, 7, 2, 1); });
const CONTAINER_SPECS = [['#a6402f', 'MSKU 402118'], ['#2f5a8a', 'TGHU 773045'], ['#3d7a4a', 'CAIU 118302'], ['#c9772f', 'HLXU 650921'], ['#2f6a6a', 'SEGU 290455'], ['#6a4a7a', 'TRLU 884210']];
const CONTAINERS = CONTAINER_SPECS.map(([c, l]) => containerTex(c, l));

/* ---------- photo look: big soft textures, organic grime, then 16-colour adaptive palette (YCoCg) + 4×4 pattern dither baked into each texture ---------- */
const cnv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  const set = new Set(ALL_MATS.map(m => m.userData.base)); TIMES.forEach(T => set.add(T.sky));
  const jobs = [];
  for (const t of set) {
    if (!t?.image || SKIP.has(t) || t.userData.photo) continue;
    const ci = CONTAINERS.indexOf(t), src = t.image, big = Math.max(src.width, src.height);
    let make;
    if (RECIPES.has(t) && PH_IDS.every(id => PH[id])) make = RECIPES.get(t);
    else if (ci >= 0) make = () => containerPhoto(...CONTAINER_SPECS[ci]);
    else if (t === TX.ground) make = groundPhoto;
    else if (TIMES.some(T => T.sky === t)) make = () => photoify(src, { long: 1024, noise: 0, k: 64, grain: 2, strength: .35 });
    else if (t === TX.paint || TX.numbers.includes(t)) make = () => photoify(src, { long: 128, noise: 0, k: 8 });
    else make = () => photoify(src, { long: big <= 8 ? 64 : big <= 16 ? 128 : big <= 32 ? 256 : 512, noise: 1 });
    jobs.push([t, make]);
  }
  let i = 0; const dev = $('dev');
  const step = () => {
    const t0 = performance.now();
    while (i < jobs.length && performance.now() - t0 < 40) { const [t, make] = jobs[i++]; t.userData.photo = canvasTex(make(), t.wrapS === THREE.RepeatWrapping); }
    dev.textContent = `Developing photos ${i} / ${jobs.length}`;
    if (i < jobs.length) setTimeout(step, 0); else { dev.hidden = true; photosReady = true; applyLook(); syncUI(); }
  };
  setTimeout(step, 30);
}
async function photoOntoTarget(file) {
  ray.setFromCamera({ x: 0, y: 0 }, cam);
  const hit = ray.intersectObjects(scene.children, true).find(h => !h.object.isSprite && h.object.material && [].concat(h.object.material).some(m => m.isShaderMaterial));
  if (!hit) { feed.unshift({ t: clock, text: 'AIM AT A SURFACE FIRST' }); return; }
  const m = Array.isArray(hit.object.material) ? hit.object.material[hit.face.materialIndex] : hit.object.material;
  try {
    const bmp = await createImageBitmap(file), sc = 512 / Math.max(bmp.width, bmp.height), c = cnv(Math.round(bmp.width * sc), Math.round(bmp.height * sc));
    const g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, c.width, c.height);
    const base = m.userData.base; base.userData.custom = canvasTex(quantize16(c, 16, .75, 3), base.wrapS === THREE.RepeatWrapping);
    applyLook(); feed.unshift({ t: clock, text: 'PHOTO APPLIED' });
  } catch { feed.unshift({ t: clock, text: 'COULD NOT READ THAT IMAGE' }); }
}
$('swapFile').onchange = () => { const f = $('swapFile').files[0]; if (f) photoOntoTarget(f); };
let dragDepth = 0;
addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; $('dropHint').hidden = false; } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('dropHint').hidden = true; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('dropHint').hidden = true; const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) photoOntoTarget(f); });

resize(); applyTime(); syncUI(); developQueue();
document.fonts?.load('16px Silkscreen').catch(() => {});
requestAnimationFrame(frame);
</script>
